# rime_frost schema patch
# encoding: utf-8

patch:
  # 1. 默认输入状态为英文 (ascii_mode 默认启用)
  "switches/@0/reset": 1

  # 2. 拼写字母表只保留小写 a-z，去除大写字母、反引号和 /（大写字母及符号直接上屏）
  "speller/alphabet": "zyxwvutsrqponmlkjihgfedcba"
  "speller/initials": "zyxwvutsrqponmlkjihgfedcba"

  # 3. 清空方案级 patterns 拦截（Unicode、金额大写、计算器、农历、反查等）
  "recognizer/patterns": {}

  # 4. 移除 symbols 符号扩展表
  "punctuator/symbols": {}

  # 5. 挂载数字接点号/冒号直接上屏处理器
  "engine/processors":
    - lua_processor@*digit_punct_fix
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
