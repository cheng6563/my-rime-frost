# rime_frost schema patch
# encoding: utf-8

patch:
  # 1. 默认输入状态为英文 (ascii_mode 默认启用)
  "switches/@0/reset": 1

  # 2. 拼写字母表包含小写 a-z 和大写 A-Z（Shift + 字母进入英文候选，去除反引号和 /）
  "speller/alphabet": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA"
  "speller/initials": "zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA"

  # 3. 清空方案级 patterns 拦截（Unicode、金额大写、计算器、农历、反查等）
  "recognizer/patterns": {}

  # 4. 移除 symbols 符号扩展表
  "punctuator/symbols": {}

  # 5. 挂载数字接点号/冒号直接上屏处理器
  "engine/processors":
    - lua_processor@*digit_punct_fix
    - lua_processor@*select_character
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  # 6. 精简 translators，移除已清空触发 pattern 的农历/数字大写/计算器等，避免日志报错
  "engine/translators":
    - punct_translator
    - table_translator@frost_aux
    - script_translator
    - lua_translator@*date_translator
    - table_translator@custom_phrase
    - table_translator@melt_eng
    - table_translator@cn_en
    - table_translator@radical_lookup
    - lua_translator@*force_gc
